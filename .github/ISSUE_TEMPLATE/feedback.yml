name: Feedback oder Verbesserung
description: Rückmeldung zur BaustellenHub App
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Bereich
      options:
        - Allgemein
        - Windows-App
        - Tablet-App
        - Berichte
        - PDFs
        - Benachrichtigungen
        - Performance
        - Materialverwaltung
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Erwarteter Nutzen
